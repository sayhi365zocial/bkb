<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแสดงตำแหน่งการใช้งาน</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            height: calc(100vh - 120px);
        }

        .input-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .input-section h2 {
            color: #555;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        #dataInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            margin-bottom: 15px;
        }

        #dataInput:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        #parseButton {
            background: #4CAF50;
            color: white;
        }

        #parseButton:hover {
            background: #45a049;
        }

        #clearButton {
            background: #f44336;
            color: white;
        }

        #clearButton:hover {
            background: #da190b;
        }

        .map-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .stats {
            padding: 15px 20px;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-label {
            color: #666;
            font-size: 14px;
        }

        .stats-value {
            color: #4CAF50;
            font-weight: bold;
            font-size: 18px;
        }

        #map {
            flex: 1;
            min-height: 400px;
        }

        .info-section {
            margin-top: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
            font-size: 14px;
            color: #666;
        }

        .info-section h3 {
            color: #555;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .info-section ul {
            list-style-position: inside;
            line-height: 1.8;
        }

        .leaflet-popup-content {
            font-family: 'Sarabun', sans-serif;
        }

        .popup-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        .popup-detail {
            color: #666;
            font-size: 14px;
            margin: 3px 0;
        }

        /* Cluster styles */
        .marker-cluster-small {
            background-color: rgba(76, 175, 80, 0.6);
        }
        .marker-cluster-small div {
            background-color: rgba(76, 175, 80, 0.8);
        }

        .marker-cluster-medium {
            background-color: rgba(255, 152, 0, 0.6);
        }
        .marker-cluster-medium div {
            background-color: rgba(255, 152, 0, 0.8);
        }

        .marker-cluster-large {
            background-color: rgba(244, 67, 54, 0.6);
        }
        .marker-cluster-large div {
            background-color: rgba(244, 67, 54, 0.8);
        }

        .marker-cluster {
            background-clip: padding-box;
            border-radius: 20px;
        }
        .marker-cluster div {
            width: 30px;
            height: 30px;
            margin-left: 5px;
            margin-top: 5px;
            text-align: center;
            border-radius: 15px;
            font: 12px "Helvetica Neue", Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: white;
            line-height: 30px;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
                height: auto;
            }

            .input-section {
                min-height: 300px;
            }

            .map-section {
                min-height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ ระบบแสดงตำแหน่งการใช้งาน</h1>

        <div class="content">
            <div class="input-section">
                <h2>📋 ข้อมูลตำแหน่ง</h2>
                <textarea
                    id="dataInput"
                    placeholder="วางข้อมูลที่นี่ (รองรับหลายรูปแบบ)&#10;&#10;แค่พิกัด:&#10;8.108287, 98.306597&#10;7.958515, 98.384452&#10;&#10;หรือมีชื่อ:&#10;พิชชาพร 8.108287, 98.306597&#10;จิรทีปต์ 7.958515, 98.384452"
                ></textarea>

                <div class="button-group">
                    <button id="parseButton">🔍 แสดงบนแผนที่</button>
                    <button id="clearButton">🗑️ ล้างข้อมูล</button>
                </div>

                <div class="info-section">
                    <h3>📌 วิธีใช้งาน:</h3>
                    <ul>
                        <li>วางข้อมูลในช่องด้านบน</li>
                        <li>กด "แสดงบนแผนที่"</li>
                        <li>คลิกที่จุดบนแผนที่เพื่อดูรายละเอียด</li>
                    </ul>
                </div>
            </div>

            <div class="map-section">
                <div class="stats">
                    <div class="stats-item">
                        <span class="stats-label">📍 จำนวนตำแหน่ง:</span>
                        <span class="stats-value" id="locationCount">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">👥 จำนวนผู้ใช้:</span>
                        <span class="stats-value" id="userCount">0</span>
                    </div>
                </div>
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        // Initialize map centered on Phuket, Thailand
        const map = L.map('map').setView([7.9, 98.35], 11);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Store markers with clustering
        let markers = [];
        let markerGroup = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true
        }).addTo(map);

        // Parse and display data
        function parseAndDisplayData() {
            const input = document.getElementById('dataInput').value.trim();

            if (!input) {
                alert('กรุณาวางข้อมูลก่อนครับ');
                return;
            }

            // Clear existing markers
            markerGroup.clearLayers();
            markers = [];

            const lines = input.split('\n');
            const locations = [];
            const uniqueUsers = new Set();

            lines.forEach((line, index) => {
                if (!line.trim()) return;

                let name = `จุดที่ ${index + 1}`;
                let id = '';
                let datetime = '';
                let lat = null;
                let lng = null;

                // Format 1: Tab-separated (full format)
                // ชื่อ[TAB]รหัส[TAB]พิกัด[TAB]วันที่
                if (line.includes('\t')) {
                    const parts = line.split('\t');
                    if (parts.length >= 3) {
                        name = parts[0].trim();
                        id = parts[1].trim();
                        const coords = parts[2].trim();
                        datetime = parts[3] ? parts[3].trim() : '';

                        const coordParts = coords.split(',');
                        if (coordParts.length === 2) {
                            lat = parseFloat(coordParts[0].trim());
                            lng = parseFloat(coordParts[1].trim());
                        }
                    }
                } else {
                    // Format 2 & 3: Space or comma separated
                    // Just coordinates: "8.108287, 98.306597"
                    // With name: "ชื่อ 8.108287, 98.306597"

                    // Try to extract coordinates (look for number patterns)
                    const coordRegex = /(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/;
                    const match = line.match(coordRegex);

                    if (match) {
                        lat = parseFloat(match[1]);
                        lng = parseFloat(match[2]);

                        // Extract name (everything before the coordinates)
                        const beforeCoords = line.substring(0, match.index).trim();
                        if (beforeCoords) {
                            name = beforeCoords;
                        }
                    }
                }

                // Add location if coordinates are valid
                if (lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng)) {
                    locations.push({
                        name,
                        id,
                        lat,
                        lng,
                        datetime
                    });
                    uniqueUsers.add(name);
                }
            });

            if (locations.length === 0) {
                alert('ไม่พบข้อมูลตำแหน่งที่ถูกต้อง\n\nรองรับรูปแบบ:\n- แค่พิกัด: 8.108287, 98.306597\n- มีชื่อ: ชื่อ 8.108287, 98.306597\n- แบบเต็ม: ชื่อ[TAB]รหัส[TAB]8.108287, 98.306597[TAB]วันที่');
                return;
            }

            // Create markers
            locations.forEach((loc, index) => {
                let popupContent = `
                    <div>
                        <div class="popup-name">${loc.name}</div>
                        <div class="popup-detail">📍 ${loc.lat.toFixed(6)}, ${loc.lng.toFixed(6)}</div>`;

                if (loc.id) {
                    popupContent += `<div class="popup-detail">🆔 ${loc.id}</div>`;
                }
                if (loc.datetime) {
                    popupContent += `<div class="popup-detail">🕐 ${loc.datetime}</div>`;
                }

                popupContent += `</div>`;

                const marker = L.marker([loc.lat, loc.lng])
                    .bindPopup(popupContent);

                markerGroup.addLayer(marker);
                markers.push(marker);
            });

            // Fit map to markers
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }

            // Update stats
            document.getElementById('locationCount').textContent = locations.length;
            document.getElementById('userCount').textContent = uniqueUsers.size;

            console.log(`✅ แสดง ${locations.length} ตำแหน่ง จาก ${uniqueUsers.size} ผู้ใช้`);
        }

        function clearData() {
            document.getElementById('dataInput').value = '';
            markerGroup.clearLayers();
            markers = [];
            document.getElementById('locationCount').textContent = '0';
            document.getElementById('userCount').textContent = '0';
            map.setView([7.9, 98.35], 11);
        }

        // Event listeners
        document.getElementById('parseButton').addEventListener('click', parseAndDisplayData);
        document.getElementById('clearButton').addEventListener('click', clearData);

        // Allow Enter key to parse (Ctrl+Enter)
        document.getElementById('dataInput').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                parseAndDisplayData();
            }
        });

        console.log('🗺️ ระบบพร้อมใช้งาน - วางข้อมูลและกด "แสดงบนแผนที่"');
    </script>
</body>
</html>
